name: Phosphor checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same pull request supersedes its running checks.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Browser checks run on software GL (SwiftShader). The look sweep and the
# control/stage show are independent, so they run as parallel jobs; together
# they check exactly what one `npm run test:browser` checks (docs/EVIDENCE.md).
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: npm test
      - run: PHOSPHOR_RHYTHM_UI=1 node --test tests/browser/control-rhythm.test.mjs
      - run: npm run build
      - run: npm run check:dist
      - run: npm run typecheck
      - run: npm run test:stage-output
      - run: npm run test:autopilot-ui
      - run: npm run test:output-controls
      - run: npm run contact -- --frames 30 --width 320 --height 180
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-verification
          path: artifacts/
          if-no-files-found: warn

  browser-lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        shard: [1/4, 2/4, 3/4, 4/4]
    name: browser lab ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: npm run build
      - run: npm run test:browser -- --only lab --shard ${{ matrix.shard }}

  browser-show:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: npm run build
      - run: npm run test:browser -- --only show
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-show
          path: artifacts/
          if-no-files-found: warn

  format:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
