<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title data-i18n="Update Phosphor">Update Phosphor</title>
    <link rel="stylesheet" href="control.css" />
  </head>
  <body>
    <main style="display: block; max-width: 680px; margin: 40px auto">
      <section class="panel">
        <h1 data-i18n="Update Phosphor">Update Phosphor</h1>
        <p
          data-i18n="Install the latest controls without clearing your saved sets."
        >
          Install the latest controls without clearing your saved sets.
        </p>
        <p
          data-i18n="Close other Phosphor tabs and windows, including the stage. Keep this updater open; it will not interrupt another open Phosphor window."
        >
          Close other Phosphor tabs and windows, including the stage. Keep this
          updater open; it will not interrupt another open Phosphor window.
        </p>
        <p
          id="updateStatus"
          role="status"
          data-i18n="Ready to check for an update."
        >
          Ready to check for an update.
        </p>
        <button
          id="applyUpdate"
          class="accent"
          data-i18n="Update and open Phosphor"
        >
          Update and open Phosphor
        </button>
        <p><a href="./" data-i18n="Back to Phosphor">Back to Phosphor</a></p>
      </section>
    </main>
    <script type="module" src="update.mjs"></script>
  </body>
</html>
